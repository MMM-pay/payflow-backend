name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets the auto-merge workflow run CI on main after it merges a PR.
  workflow_dispatch:

# Every job below only reads the repository: it checks the code out and runs
# a command against it. Nothing here writes to the repository, the API or the
# package registry, so the token gets read-only access to the contents and
# nothing else. Any permission that is not listed is set to none.
#
# The npm cache is not affected by this: it is written through the runner's
# own cache token, not through GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    # Check the code out and read it. Nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    # Check the code out and read it. Nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    # Check the code out and read it. Nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  test-postgres:
    name: test (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow
          POSTGRES_DB: payflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payflow:payflow@localhost:5432/payflow_test
      LOG_LEVEL: fatal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  # Fails on high and critical advisories in production dependencies. Dev
  # advisories do not fail the job, and Dependabot keeps both current.
  audit:
    name: audit
    runs-on: ubuntu-latest
    # Check the code out and read it. The audit talks to the npm registry,
    # not to the repository, so it needs no permission of its own.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: build
    runs-on: ubuntu-latest
    # Check the code out and read it. Nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  # Builds the image the way a deployment would, and pushes nothing: the
  # build is the check, the release workflow publishes the image. A Dockerfile
  # that no longer builds is a broken deployment path, and this is where that
  # is caught.
  docker:
    name: docker build
    runs-on: ubuntu-latest
    # Check the code out and build the image from it. The build pushes
    # nothing, so it needs no permission beyond reading the source: the
    # build cache is written through the runner's own cache token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: payflow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
